# Render blueprint for PlateQuote (free plans, ruled 2026-10-28 "free plan for now").
# Syncing this blueprint is the owner's step. Editing the file does not deploy by itself.
# Free web services have an ephemeral disk and sleep after 15 minutes idle, so uploads
# do not survive a restart and the first request after a sleep is slow. The free Postgres
# has a time limit on Render's side; upgrade it before judging if it is close to expiry.
# The slicer worker runs as a second free web service because private services have no
# free plan. Set SLICER_WORKER_URL in the dashboard if Render suffixes the worker's name.
#
# platequote-worker-auth holds one generated SLICER_WORKER_TOKEN and is linked to both
# services, so /slice and the web app share the same secret. Do not set
# PAYPAL_ALLOW_UNVERIFIED_WEBHOOKS here. Admin sign-in stays locked until
# ADMIN_PASSWORD is filled in on the web service (the local dev password is refused).

envVarGroups:
  - name: platequote-worker-auth
    envVars:
      - key: SLICER_WORKER_TOKEN
        generateValue: true

services:
  - type: web
    name: platequote-web
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && node prisma/seed.mjs && npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: platequote-db
          property: connectionString
      - key: SLICER_WORKER_URL
        value: https://platequote-worker.onrender.com
      - fromGroup: platequote-worker-auth
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      - key: UPLOAD_DIR
        value: /tmp/platequote-uploads
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      # Live PayPal for the custom domain only. The onrender.com address stays on the
      # sandbox (ruled 2026-10-29 for the Dec 1 to 15 judging window). Fill the live
      # keys in the dashboard; they are never in this file.
      - key: PAYPAL_LIVE_HOSTS
        value: platequote.tech,www.platequote.tech
      - key: PAYPAL_LIVE_CLIENT_ID
        sync: false
      - key: PAYPAL_LIVE_CLIENT_SECRET
        sync: false
      - key: PAYPAL_LIVE_WEBHOOK_ID
        sync: false
      - key: LLM_PROVIDER
        value: mock
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: LLM_BASE_URL
        sync: false

  - type: web
    name: platequote-worker
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./worker/Dockerfile
    dockerContext: ./worker
    healthCheckPath: /health
    envVars:
      - fromGroup: platequote-worker-auth

databases:
  - name: platequote-db
    plan: free
    databaseName: platequote
    user: platequote
